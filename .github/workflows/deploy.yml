# 파일 위치: .github/workflows/deploy.yml
name: Build and Push to GHCR

on:
  push:
    branches: [ "main" ] # main 브랜치에 코드가 머지될 때만 실행
    paths:               # 관련 폴더가 변경되었을 때만 트리거 (모노레포 최적화)
      - 'router/**'
      - 'ai-model/**'
      - '.github/workflows/**'
  pull_request:          # PR을 올릴 때는 빌드 '테스트'만 수행 (Push 안 함)
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io

jobs:
  # ==========================================
  # 1. Go 라우터 빌드 및 배포
  # ==========================================
  build-go-router:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # GHCR에 이미지를 푸시하기 위한 권한

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # 별도 설정 없이 GitHub이 자동 발급!

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Go Router
        uses: docker/build-push-action@v5
        with:
          context: ./router
          push: ${{ github.event_name != 'pull_request' }} # PR일 때는 Push 생략
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/kyle-go-router:latest
            ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/kyle-go-router:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # 2. Python AI 서버 빌드 및 배포
  # ==========================================
  build-ai-server:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 🟢 [핵심] 이 변수 생성 스텝이 빌드(Build and push) 직전에 반드시 있어야 합니다!
      - name: Set lower case repository owner
        run: |
          echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Build and push Python AI Server
        uses: docker/build-push-action@v5
        with:
          context: ./ai-model
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/kyle-ai-server:latest
            ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/kyle-ai-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max