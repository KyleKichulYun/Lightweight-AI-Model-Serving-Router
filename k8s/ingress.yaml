# k8s/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-router-ingress
  namespace: default
  annotations:
    # NGINX 문지기 배정
    kubernetes.io/ingress.class: nginx
    # 요청 바디 크기 제한 늘리기 (AI 프롬프트가 길어질 수 있으므로)
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  rules:
  - host: api.kyles-ai.local   # 👈 우리가 사용할 로컬 전용 멋진 도메인!
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: go-router-svc  # 👈 도메인으로 들어오면 Go 라우터(포트 80)로 토스!
            port:
              number: 80